========================= */

========================= */

    left: 50%;

========================= */

    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr auto;
    gap: 25px;
    padding: 40px;
    background: #000;
}

#encounter.alexanScene::before {
    content: "@";
    grid-column: 1;
    grid-row: 1;
    align-self: center;
    justify-self: center;
    color: #00ff66;
    font-size: 9rem;
    text-shadow: 0 0 10px #00ff66, 0 0 30px #00ff66;
}

#encounter.alexanScene::after {
    content: "X";

    grid-row: 1;
    align-self: center;
    justify-self: center;
    color: #00ff66;
    font-size: 12rem;
    text-shadow: 0 0 10px #00ff66, 0 0 30px #00ff66;
}

    grid-column: 2;
    grid-row: 2;

    line-height: 1.5;
    text-align: left;

}

/* =========================================================
   MAP GENERATOR

   Levels 11-29 are intentionally much larger than 1-10.
   Each level is 41 columns x 21 rows.  The generator creates
   long corridors and extra walls while guaranteeing a route
   from @ to >.
========================================================= */

function makeLargeMaze(seed, difficulty) {
    // Levels 11-30 use a LABYRINTH rather than a conventional maze:
    // wide, readable corridors, lots of loops, and several ways around
    // obstacles so two hunters can be juked instead of forcing a single path.
    const width = 41;
    const height = 21;
    const grid = Array.from({length: height}, () => Array(width).fill(" "));

    // Deterministic pseudo-random generator.
    let state = (seed >>> 0) || 1;
    function rand() {
        state = (state * 1664525 + 1013904223) >>> 0;
        return state / 4294967296;
    }

    // Outer walls.
    for (let x=0; x<width; x++) {
        grid[0][x] = "#";
        grid[height-1][x] = "#";
    }
    for (let y=0; y<height; y++) {
        grid[y][0] = "#";
        grid[y][width-1] = "#";
    }

    // Long wall pieces make a winding labyrinth. Every piece deliberately
    // has openings, so there are multiple routes around it.
    const horizontalRows = [3, 7, 11, 15, 18];
    const verticalCols = [8, 16, 25, 33];

    for (let r=0; r<horizontalRows.length; r++) {
        const y = horizontalRows[r];
        const reverse = ((Math.floor(rand()*2) + r) & 1) === 1;
        const startX = reverse ? 23 : 3;
        const endX   = reverse ? 37 : 37;
        const gapA = 5 + Math.floor(rand()*7);
        const gapB = 20 + Math.floor(rand()*8);

        for (let x=startX; x<=endX; x++) {
            if (x===gapA || x===gapA+1 || x===gapB || x===gapB+1) continue;
            // Leave the outer edge and spawn/exit areas comfortable.
            if (x>1 && x<width-2) grid[y][x]="#";
        }
    }

    for (let c=0; c<verticalCols.length; c++) {
        const x = verticalCols[c];
        const reverse = ((Math.floor(rand()*2) + c) & 1) === 1;
        const startY = reverse ? 4 : 2;
        const endY   = reverse ? 18 : 17;
        const gapA = 5 + Math.floor(rand()*4);
        const gapB = 12 + Math.floor(rand()*4);

        for (let y=startY; y<=endY; y++) {
            if (y===gapA || y===gapA+1 || y===gapB || y===gapB+1) continue;
            if (y>1 && y<height-2) grid[y][x]="#";
        }
    }

    // Add smaller staggered wall pieces as difficulty rises. They are only
    // accepted if the whole walkable area remains connected, preventing
    // impossible sections while preserving alternate escape routes.
    function connected() {
        const q=[{x:1,y:1}];
        const seen=new Set(["1,1"]);
        const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
        while(q.length){
            const cur=q.shift();
            for(const [dx,dy] of dirs){
                const nx=cur.x+dx, ny=cur.y+dy;
                if(nx<=0||ny<=0||nx>=width-1||ny>=height-1||grid[ny][nx]==="#") continue;
                const k=`${nx},${ny}`;
                if(!seen.has(k)){seen.add(k);q.push({x:nx,y:ny});}
            }
        }
        let open=0;
        for(let y=1;y<height-1;y++) for(let x=1;x<width-1;x++) if(grid[y][x]!=="#") open++;
        return seen.size===open;
    }

    const extra = Math.min(12, 3 + Math.floor(difficulty*0.45));
    for(let n=0; n<extra; n++) {
        const horizontal = rand() < 0.55;
        const len = 3 + Math.floor(rand()*4);
        let x = 3 + Math.floor(rand()*(width-7));
        let y = 2 + Math.floor(rand()*(height-5));
        if(horizontal) {
            for(let i=0;i<len && x+i<width-2;i++) {
                if(grid[y][x+i]==="#") continue;
                grid[y][x+i]="#";
                if(!connected()) grid[y][x+i]=" ";
            }
        } else {
            for(let i=0;i<len && y+i<height-2;i++) {
                if(grid[y+i][x]==="#") continue;
                grid[y+i][x]="#";
                if(!connected()) grid[y+i][x]=" ";
            }
        }
    }

    // Keep the start and nearby area open so the player gets room to react.
    for(let y=1;y<=3;y++) for(let x=1;x<=5;x++) grid[y][x]=" ";

    // Find a distant exit. Because the labyrinth is connected, this always
    // gives the player a real route to the finish.
    const q=[{x:1,y:1}];
    const dist=new Map([["1,1",0]]);
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    let far={x:1,y:1,d:0};
    while(q.length){
        const cur=q.shift();
        const cd=dist.get(`${cur.x},${cur.y}`);
        if(cd>far.d) far={x:cur.x,y:cur.y,d:cd};
        for(const [dx,dy] of dirs){
            const nx=cur.x+dx, ny=cur.y+dy;
            if(nx<=0||ny<=0||nx>=width-1||ny>=height-1||grid[ny][nx]==="#") continue;
            const k=`${nx},${ny}`;
            if(!dist.has(k)){dist.set(k,cd+1);q.push({x:nx,y:ny});}
        }
    }

    grid[1][1]="@";
    grid[far.y][far.x]=">";
    return grid.map(row=>row.join(""));
}

/* =========================================================
   MUSIC
========================================================= */

function musicLabel(key) {
    let list = document.getElementById("musicList");
    if (!list) return;
    list.innerHTML = "";

    const order = ["hunter", "alexan", "level11", "level20", "boss"];
    for (const k of order) {
        const visible = (k === "hunter" && level >= 4 && level <= 10) ||
                        (k === "alexan" && level === 10) ||
                        (k === "level11" && level >= 11 && level <= 19) ||
                        (k === "level20" && level >= 20 && level <= 29) ||
                        (k === "boss" && level === 30);
        if (!visible) continue;
        const div = document.createElement("div");
        div.textContent = (k === currentMusicKey ? "♪ " : "  ") + musicNames[k];
        div.className = k === currentMusicKey ? "activeSong" : "";
        list.appendChild(div);
    }
}

let audioUnlocked = false;

function unlockAudio() {
    // IMPORTANT: only unlock audio once.
    // Re-loading the music on every key press was causing the current song
    // to restart repeatedly while the player moved.
    if (!audioUnlocked) {
        audioUnlocked = true;

        // Start the already-selected track without replacing/reloading it.
        if (currentMusicKey && hunterMusic.paused) {
            hunterMusic.play().catch(()=>{});
        }

        ambience.play().catch(()=>{});
        return;
    }

    // Once audio is unlocked, a key press should NEVER reload or restart
    // the current music. Only resume it if the browser paused it.
    if (currentMusicKey && hunterMusic.paused) {
        hunterMusic.play().catch(()=>{});
    }
    if (ambience.paused) {
        ambience.play().catch(()=>{});
    }
}

function playTrack(key) {
    if (!musicTracks[key]) return;

    // Same track = keep it playing continuously.
    // This is what makes one song span all levels in its section.
    if (currentMusicKey === key) {
        musicLabel(key);
        if (audioUnlocked && hunterMusic.paused) {
            hunterMusic.play().catch(()=>{});
        }
        return;
    }

    // A genuinely new track starts from the beginning.
    hunterMusic.pause();
    hunterMusic.currentTime = 0;
    hunterMusic.src = musicTracks[key];
    hunterMusic.preload = "auto";
    hunterMusic.loop = true;
    currentMusicKey = key;
    musicLabel(key);

    // If the player has already interacted with the page, start immediately.
    if (audioUnlocked) hunterMusic.play().catch(()=>{});
}

function stopTrack() {
    hunterMusic.pause();
    hunterMusic.currentTime = 0;
    currentMusicKey = null;
    musicLabel(null);
}

function updateMusicForLevel() {
    if (level >= 4 && level <= 10) playTrack("hunter");
    else if (level === 10) playTrack("alexan");
    else if (level >= 11 && level <= 19) playTrack("level11");
    else if (level >= 20 && level <= 29) playTrack("level20");
    else if (level === 30) playTrack("boss");
    else if (level < 4) stopTrack();
}

/* =========================================================
   DRAW MAP
========================================================= */

function drawMap() {
    const map = getMap();
    let html = "";

    for (let y=0; y<map.length; y++) {
        for (let x=0; x<map[y].length; x++) {
            if (x === playerX && y === playerY) {
                html += "@";
            } else if (bossActive && x === bossX && y === bossY) {
                html += '<span class="boss">X</span>';
            } else {
                const h = hunters.findIndex(h => h.active && h.x === x && h.y === y);
                if (h >= 0) html += '<span class="hunter">X</span>';
                else html += map[y][x]
                    .replace(/&/g,"&amp;")
                    .replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;");
            }
        }
        html += "\n";
    }
    screen.innerHTML = html;

    const iframes = Date.now() < invulnerableUntil ? "   [INVINCIBLE]" : "";
    message.textContent = `LEVEL ${level}   ♥ ${lives}/3${gunObtained ? "   [GUN]" : ""}${iframes}`;
}

function getMap() {
    return levels[level - 1];
}

function isWalkable(x,y) {
    const map=getMap();
    const tile=map[y]?.[x];
    return tile !== undefined && tile !== "#";
}

/* =========================================================
   LIVES / COLLISION
========================================================= */

function loseLife() {
    if (Date.now() < invulnerableUntil || gameOver) return;

    lives--;
    invulnerableUntil = Date.now() + 2200;

    stopHunterTimer();
    stopBossTimer();

    if (lives <= 0) {
        startEncounter("THE MAZE GOT YOU.\nNO LIVES REMAIN.");
        return;
    }

    playerX = 1;
    playerY = 1;
    message.textContent = `LIFE LOST — ${lives} REMAINING — INVINCIBLE`;
    drawMap();

    // Give the player time to get away before enemies begin moving again.
    setTimeout(() => {
        if (gameOver) return;
        if (level >= 4 && level <= 29) spawnHunters();
        if (level === 30 && bossActive) startBossTimer();
        drawMap();
    }, 2200);
}

function checkEnemyCollision() {
    if (Date.now() < invulnerableUntil) return false;
    if (bossActive && playerX === bossX && playerY === bossY) {
        loseLife();
        return true;
    }
    if (hunters.some(h => h.active && h.x === playerX && h.y === playerY)) {
        loseLife();
        return true;
    }
    return false;
}

/* =========================================================
   PLAYER MOVEMENT + SHIFT DASH

   Shift + a direction performs a 3-tile slide immediately.
   There is no one-second charge or delay.
========================================================= */

function movePlayer(dx,dy,sprint=false) {
    if (gameOver) return;

    const distance = sprint ? 3 : 1;
    let moved = false;

    for (let i=0; i<distance; i++) {
        const nx=playerX+dx;
        const ny=playerY+dy;
        if (!isWalkable(nx,ny)) break;

        playerX=nx;
        playerY=ny;
        moved=true;

        if (walkSound) {
            walkSound.currentTime=0;
            walkSound.play().catch(()=>{});
        }

        if (getMap()[playerY][playerX] === ">") {
            nextLevel();
            return;
        }

        if (checkEnemyCollision()) return;
    }

    if (moved) drawMap();
}

document.addEventListener("keydown", e => {
    unlockAudio();
    const key=e.key.toLowerCase();
    const allowed=["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"];
    if (!allowed.includes(key)) return;
    e.preventDefault();
    if (gameOver) return;

    let dx=0,dy=0;
    if (key==="w"||key==="arrowup") dy=-1;
    if (key==="s"||key==="arrowdown") dy=1;
    if (key==="a"||key==="arrowleft") dx=-1;
    if (key==="d"||key==="arrowright") dx=1;

    movePlayer(dx,dy,e.shiftKey);
    ambience.play().catch(()=>{});
});

/* =========================================================
   HUNTERS — TWO AFTER ALEXAN
========================================================= */

function findOpenTiles() {
    const map=getMap();
    const result=[];
    for(let y=1;y<map.length-1;y++) for(let x=1;x<map[y].length-1;x++) {
        if(map[y][x]!=="#") result.push({x,y});
    }
    return result;
}

function farthestOpenTile(fromX,fromY, used=[]) {
    const tiles=findOpenTiles();
    const q=[{x:fromX,y:fromY}];
    const dist=new Map([[`${fromX},${fromY}`,0]]);
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
        const cur=q.shift();
        const cd=dist.get(`${cur.x},${cur.y}`);
        for(const [dx,dy] of dirs){
            const nx=cur.x+dx,ny=cur.y+dy;
            if(!isWalkable(nx,ny)) continue;
            const k=`${nx},${ny}`;
            if(!dist.has(k)){dist.set(k,cd+1);q.push({x:nx,y:ny});}
        }
    }
    let best=null,bestD=-1;
    for(const t of tiles){
        if(used.some(u=>u.x===t.x&&u.y===t.y)) continue;
        const d=dist.get(`${t.x},${t.y}`);
        if(d!==undefined && d>bestD){best=t;bestD=d;}
    }
    return best || {x:1,y:1};
}

function findExitTile() {
    const map=getMap();
    for(let y=0;y<map.length;y++) {
        for(let x=0;x<map[y].length;x++) {
            if(map[y][x] === ">") return {x,y};
        }
    }
    return farthestOpenTile(1,1);
}

function findPathFromStartToExit() {
    const exit=findExitTile();
    const path=findPath(1,1,exit.x,exit.y);
    // Include the exit itself at the end of the route.
    return [{x:1,y:1}, ...path];
}

function spawnHunters() {
    stopHunterTimer();
    hunters=[];

    if (level < 4 || level > 29 || level === 10) return;

    if (level <= 9) {
        // Levels 4–9 keep their original single-hunter behavior.
        const first=farthestOpenTile(playerX,playerY);
        hunters=[{x:first.x,y:first.y,active:true}];
    } else {
        // Levels 11–29: put both hunters at the ESCAPE ROUTE rather than
        // beside the player's spawn. This gives the player a safe opening
        // and lets the hunters create pressure around the final approach.
        const route=findPathFromStartToExit();
        const usable=route.filter(p => !(p.x===playerX && p.y===playerY));
        const n=usable.length;

        // One hunter starts on the exit, the other starts a few steps before
        // it. They are separated enough that they do not instantly overlap.
        const exitPos=usable[n-1] || findExitTile();
        const secondPos=usable[Math.max(0,n-7)] || exitPos;

        hunters=[
            {x:exitPos.x,y:exitPos.y,active:true},
            {x:secondPos.x,y:secondPos.y,active:true}
        ];
    }

    updateMusicForLevel();
    startHunterTimer();
    drawMap();
}

function findPath(fromX,fromY,toX,toY) {
    const map=getMap();
    const q=[{x:fromX,y:fromY}];
    const prev=new Map();
    const seen=new Set([`${fromX},${fromY}`]);
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];

    while(q.length){
        const cur=q.shift();
        if(cur.x===toX&&cur.y===toY) break;
        for(const [dx,dy] of dirs){
            const nx=cur.x+dx,ny=cur.y+dy;
            if(!isWalkable(nx,ny)) continue;
            const k=`${nx},${ny}`;
            if(seen.has(k)) continue;
            seen.add(k); prev.set(k,`${cur.x},${cur.y}`); q.push({x:nx,y:ny});
        }
    }

    const target=`${toX},${toY}`;
    const start=`${fromX},${fromY}`;
    if(!seen.has(target)) return [];
    const path=[]; let cur=target;
    while(cur!==start){
        const [x,y]=cur.split(",").map(Number);
        path.unshift({x,y});
        cur=prev.get(cur);
        if(!cur) break;
    }
    return path;
}

function hunterSpeed() {
    // Hunters get faster throughout the descent.
    if (level <= 10) return Math.max(220, 430 - (level-4)*30);
    return Math.max(115, 460 - (level-11)*17);
}

function moveHunters() {
    if(gameOver || level<4 || level>29 || Date.now() < invulnerableUntil) return;
    for(const h of hunters) {
        if(!h.active) continue;
        const path=findPath(h.x,h.y,playerX,playerY);
        if(path.length) { h.x=path[0].x; h.y=path[0].y; }
    }
    if(checkEnemyCollision()) return;
    drawMap();
}

function startHunterTimer() {
    stopHunterTimer();
    hunterTimer=setInterval(moveHunters,hunterSpeed());
}

function stopHunterTimer() {
    if(hunterTimer!==null){clearInterval(hunterTimer);hunterTimer=null;}
}

/* =========================================================
   BOSS — LEVEL 30
========================================================= */

function startBoss() {
    stopHunterTimer();
    hunters=[];
    bossActive=true;
    bossHits=0;
    playerX=1;
    playerY=1;

    const spot=farthestOpenTile(playerX,playerY);
    bossX=spot.x;
    bossY=spot.y;

    playTrack("boss");
    message.textContent=`LEVEL 30   ♥ ${lives}/3   [GUN]   X HITS: 0/${BOSS_HITS_NEEDED}`;
    drawMap();
    startBossTimer();
}

function startBossTimer() {
    stopBossTimer();
    if(!bossActive) return;
    bossTimer=setInterval(moveBoss,900);
}

function stopBossTimer() {
    if(bossTimer!==null){clearInterval(bossTimer);bossTimer=null;}
}

function moveBoss() {
    if(!bossActive || gameOver || Date.now() < invulnerableUntil) return;
    const path=findPath(bossX,bossY,playerX,playerY);
    if(path.length>1) { bossX=path[0].x; bossY=path[0].y; }
    else if(path.length===1) { bossX=path[0].x; bossY=path[0].y; }
    if(checkEnemyCollision()) return;
    drawMap();
}

screen.addEventListener("click", e => {
    if(!bossActive || gameOver || !gunObtained) return;
    if(!e.target.classList.contains("boss")) return;

    bossHits++;
    if(bossHits >= BOSS_HITS_NEEDED) {
        defeatBoss();
        return;
    }

    // The boss retreats one tile after being hit.
    const path=findPath(bossX,bossY,playerX,playerY);
    if(path.length>2){
        const retreat=path[path.length-1];
        bossX=retreat.x; bossY=retreat.y;
    }
    message.textContent=`LEVEL 30   ♥ ${lives}/3   [GUN]   X HITS: ${bossHits}/${BOSS_HITS_NEEDED}`;
    drawMap();
});

function defeatBoss() {
    bossActive=false;
    stopBossTimer();
    message.textContent="THE RED X IS DOWN — THE GATE IS OPEN";

    const map=getMap();
    // Open a gate at the lower-right edge and make it the exit.
    const y=map.length-2;
    const row=map[y].split("");
    row[row.length-2]=">";
    levels[29][y]=row.join("");
    drawMap();
}

/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel() {
    stopHunterTimer();
    stopBossTimer();
    hunters=[];
    bossActive=false;

    if(level===10){
        startAlexanStory();
        return;
    }

    if(level>=30){
        // Level 30 is the final boss arena.
        if(level===30 && !bossActive){
            startBoss();
        } else if(level>30){
            winGame();
        }
        return;
    }

    level++;
    playerX=1;
    playerY=1;

    if(level===30){
        // The final level starts the slow-moving red X boss immediately.
        startBoss();
        return;
    }

    if(level===25){
        startGunStory();
        return;
    }

    const flash=document.getElementById("levelFlash");
    flash.style.opacity="1";
    setTimeout(()=>flash.style.opacity="0",250);

    if(level===10) stopTrack();
    else if(level>=4 && level<=29) spawnHunters();
    else updateMusicForLevel();
    drawMap();
}

/* =========================================================
   WIN / GAME OVER
========================================================= */

function startEncounter(text){
    if(gameOver) return;
    gameOver=true;
    stopHunterTimer();
    stopBossTimer();
    lightsOff.play().catch(()=>{});
    const encounter=document.getElementById("encounter");
    encounter.classList.remove("alexanScene");
    encounter.style.display="flex";
    const creepy=document.getElementById("creepyText");
    creepy.textContent=text || "CAUGHT";
    creepy.style.opacity="1";
}

function winGame(){
    gameOver=true;
    stopHunterTimer();
    stopBossTimer();
    stopTrack();
    ambience.pause();
    document.getElementById("message").textContent="YOU ESCAPED";
    const text=document.getElementById("creepyText");
    text.textContent="YOU ESCAPED";
    text.style.opacity="1";
    document.getElementById("encounter").style.display="flex";
    setTimeout(()=>{window.location.href="index.html";},3500);
}
