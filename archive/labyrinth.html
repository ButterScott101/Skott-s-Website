<script>

/* =========================================================
   AUDIO
========================================================= */

const walkSound =
    document.getElementById("walkSound");

const lightsOff =
    document.getElementById("lightsOff");

const ambience =
    document.getElementById("ambience");

const hunterMusic =
    document.getElementById("hunterMusic");


/*
    Hunter music for each hunter level.

    Put these files inside:

    audio/
        hunter4.mp3
        hunter5.mp3
        hunter6.mp3
        hunter7.mp3
        hunter8.mp3
        hunter9.mp3

    If one doesn't exist, the game falls back to
    disstressing.mp3.
*/

const hunterSongs = {
    4: "audio/hunter4.mp3",
    5: "audio/hunter5.mp3",
    6: "audio/hunter6.mp3",
    7: "audio/hunter7.mp3",
    8: "audio/hunter8.mp3",
    9: "audio/hunter9.mp3"
};


/* =========================================================
   LEVEL MAPS
=========================================================

   # = wall
   space = floor
   @ = player start
   > = exit
   X = hunter spawn

========================================================= */

const levels = [

/* =========================
   LEVEL 1
========================= */

[
"####################",
"#@       #         #",
"######   #   ####  #",
"#        #      #  #",
"#  ####### ### #  #",
"#             #   #",
"#  ####  # ## ### #",
"#       #       #>#",
"####################"
],


/* =========================
   LEVEL 2
========================= */

[
"####################",
"#@     #           #",
"#####  #  ######## #",
"#      #        #  #",
"#  ###########  #  #",
"#              #   #",
"#  ############### #",
"#                 >#",
"####################"
],


/* =========================
   LEVEL 3
========================= */

[
"####################",
"#@        #        #",
"#  ###### # ###### #",
"#  #      #      # #",
"#  # ########### # #",
"#  #             # #",
"#  ############### #",
"#                 >#",
"####################"
],


/* =========================
   LEVEL 4
   Hunter begins outside.
========================= */

[
"####################",
"#@       #         #",
"######   #   ####  #",
"#        #      #  #",
"#  ####### ### #  #",
"#             #   #",
"#  ####  # ## ### #",
"#       #       #>#",
"####################"
],


/* =========================
   LEVEL 5
========================= */

[
"####################",
"#@   #             #",
"# ## #  ########## #",
"#    #             #",
"#### ########### # #",
"#                # #",
"# ############## # #",
"#               ># #",
"####################"
],


/* =========================
   LEVEL 6
========================= */

[
"####################",
"#@                 #",
"# ###### # ######  #",
"#      # #      #  #",
"###### # ###### #  #",
"#      #      # #  #",
"#  ########## # #  #",
"#             # >  #",
"####################"
],


/* =========================
   LEVEL 7
========================= */

[
"####################",
"#@      #          #",
"#  #### # ######## #",
"#     # #          #",
"##### # ########## #",
"#     #            #",
"# ########### #### #",
"#                >#",
"####################"
],


/* =========================
   LEVEL 8
========================= */

[
"####################",
"#@    #            #",
"# ### # ########## #",
"#   # #            #",
"### # ###########  #",
"#   #             #",
"# ####### ##########",
"#               > #",
"####################"
],


/* =========================
   LEVEL 9
========================= */

[
"####################",
"#@       #         #",
"# ###### # ######  #",
"#      # #      #  #",
"# #### # ###### #  #",
"#    # #      # #  #",
"#### # ###### # #  #",
"#       #      # >#",
"####################"
],


/* =========================
   LEVEL 10
   STRAIGHT LINE
========================= */

[
"####################",
"#@                >#",
"####################"
]

];


/* =========================================================
   GAME VARIABLES
========================================================= */

let level = 1;

let playerX = 1;
let playerY = 1;

let hunterX = -1;
let hunterY = -1;

let hunterActive = false;

let hunterTimer = null;

let gameOver = false;


/*
    Hunter speed.

    Lower number = faster.

    Level 4 starts fairly fast.
    Each level becomes faster.
*/

const hunterSpeeds = {
    4: 420,
    5: 370,
    6: 325,
    7: 285,
    8: 250,
    9: 215
};


/* =========================================================
   CURRENT MAP
========================================================= */

function getMap() {
    return levels[level - 1];
}


/* =========================================================
   DRAW MAP
========================================================= */

const screen =
    document.getElementById("screen");


function drawMap() {

    const map = getMap();

    let output = "";

    for (let y = 0; y < map.length; y++) {

        for (let x = 0; x < map[y].length; x++) {

            /*
                Player
            */

            if (
                x === playerX &&
                y === playerY
            ) {

                output += "@";

            }

            /*
                Hunter
            */

            else if (
                hunterActive &&
                x === hunterX &&
                y === hunterY
            ) {

                output += "X";

            }

            else {

                output += map[y][x];

            }

        }

        output += "\n";
    }

    screen.textContent = output;

    /*
        Make the X red after drawing.
        Because <pre> text is normally one text node,
        we replace the X visually using HTML.
    */

    let html = "";

    for (let y = 0; y < map.length; y++) {

        for (let x = 0; x < map[y].length; x++) {

            if (
                x === playerX &&
                y === playerY
            ) {

                html += "@";

            }

            else if (
                hunterActive &&
                x === hunterX &&
                y === hunterY
            ) {

                html += '<span class="hunter">X</span>';

            }

            else {

                html += map[y][x]
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");

            }

        }

        html += "\n";
    }

    screen.innerHTML = html;
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

document.addEventListener("keydown", function(e) {

    /*
        IMPORTANT:

        Only these eight movement keys are accepted.

        This fixes the Caps Lock / Tab bug.
    */

    const key = e.key.toLowerCase();

    const movementKeys = [
        "w",
        "a",
        "s",
        "d",
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright"
    ];

    if (!movementKeys.includes(key)) {
        return;
    }

    /*
        Prevent browser scrolling with arrow keys.
    */

    e.preventDefault();

    if (gameOver) {
        return;
    }

    let dx = 0;
    let dy = 0;

    if (
        key === "w" ||
        key === "arrowup"
    ) {
        dy = -1;
    }

    if (
        key === "s" ||
        key === "arrowdown"
    ) {
        dy = 1;
    }

    if (
        key === "a" ||
        key === "arrowleft"
    ) {
        dx = -1;
    }

    if (
        key === "d" ||
        key === "arrowright"
    ) {
        dx = 1;
    }


    const map = getMap();

    const newX = playerX + dx;
    const newY = playerY + dy;

    const tile =
        map[newY]?.[newX];


    /*
        Do not walk into walls.
    */

    if (tile === "#" || tile === undefined) {
        return;
    }


    /*
        Play walking sound.
    */

    walkSound.currentTime = 0;

    walkSound.play().catch(() => {});


    playerX = newX;
    playerY = newY;


    /*
        Check if the player reached the exit.
    */

    if (tile === ">") {

        nextLevel();

        return;
    }


    /*
        Check hunter collision.
    */

    if (
        hunterActive &&
        playerX === hunterX &&
        playerY === hunterY
    ) {

        startEncounter();

        return;
    }


    drawMap();

});


/* =========================================================
   HUNTER SPAWN
========================================================= */

function spawnHunter() {

    hunterActive = true;

    const map = getMap();


    /*
        The hunter deliberately starts outside
        the visible maze.

        This makes it appear to slide into the maze.
    */

    hunterX = map[0].length - 1;
    hunterY = map.length - 2;


    /*
        Find a usable entrance.

        If the starting position is a wall,
        the hunter searches for the closest
        walkable position along the outside.
    */

    const entrance =
        findClosestWalkableTile(
            hunterX,
            hunterY
        );


    hunterX = entrance.x;
    hunterY = entrance.y;


    drawMap();


    /*
        Start hunter movement.
    */

    startHunterTimer();

}


/* =========================================================
   FIND CLOSEST WALKABLE TILE
========================================================= */

function findClosestWalkableTile(startX, startY) {

    const map = getMap();

    const queue = [
        {
            x: startX,
            y: startY
        }
    ];

    const visited = new Set();

    while (queue.length > 0) {

        const current =
            queue.shift();

        const key =
            current.x + "," + current.y;

        if (visited.has(key)) {
            continue;
        }

        visited.add(key);


        const tile =
            map[current.y]?.[current.x];


        if (
            tile !== "#" &&
            tile !== undefined
        ) {

            return current;
        }


        const directions = [
            {x: 1, y: 0},
            {x: -1, y: 0},
            {x: 0, y: 1},
            {x: 0, y: -1}
        ];


        for (const dir of directions) {

            const nx =
                current.x + dir.x;

            const ny =
                current.y + dir.y;

            if (
                nx >= 0 &&
                nx < map[0].length &&
                ny >= 0 &&
                ny < map.length
            ) {

                queue.push({
                    x: nx,
                    y: ny
                });

            }

        }

    }


    return {
        x: 1,
        y: 1
    };

}


/* =========================================================
   HUNTER PATHFINDING
=========================================================

   The hunter does NOT simply teleport toward
   the player.

   It calculates an actual path through the maze.

========================================================= */

function findHunterPath() {

    const map = getMap();

    const queue = [
        {
            x: hunterX,
            y: hunterY
        }
    ];

    const visited = new Set();

    const previous = new Map();


    const startKey =
        hunterX + "," + hunterY;

    visited.add(startKey);


    while (queue.length > 0) {

        const current =
            queue.shift();


        /*
            Player found.
        */

        if (
            current.x === playerX &&
            current.y === playerY
        ) {

            break;
        }


        const directions = [
            {x: 1, y: 0},
            {x: -1, y: 0},
            {x: 0, y: 1},
            {x: 0, y: -1}
        ];


        for (const dir of directions) {

            const nx =
                current.x + dir.x;

            const ny =
                current.y + dir.y;


            /*
                Only move through floor tiles.
            */

            if (
                ny < 0 ||
                ny >= map.length ||
                nx < 0 ||
                nx >= map[ny].length
            ) {
                continue;
            }


            const tile =
                map[ny][nx];


            if (tile === "#") {
                continue;
            }


            const key =
                nx + "," + ny;


            if (visited.has(key)) {
                continue;
            }


            visited.add(key);

            previous.set(
                key,
                current.x + "," + current.y
            );


            queue.push({
                x: nx,
                y: ny
            });

        }

    }


    /*
        Reconstruct path.
    */

    const playerKey =
        playerX + "," + playerY;


    if (!visited.has(playerKey)) {

        return [];

    }


    const path = [];

    let currentKey = playerKey;


    while (
        currentKey !== startKey
    ) {

        const [x, y] =
            currentKey.split(",").map(Number);

        path.unshift({
            x: x,
            y: y
        });

        currentKey =
            previous.get(currentKey);

        if (!currentKey) {
            break;
        }

    }


    return path;

}


/* =========================================================
   MOVE HUNTER
========================================================= */

function moveHunter() {

    if (
        !hunterActive ||
        gameOver
    ) {
        return;
    }


    const path =
        findHunterPath();


    /*
        If the hunter has a route,
        move exactly one tile along it.
    */

    if (path.length > 0) {

        hunterX = path[0].x;
        hunterY = path[0].y;

    }


    /*
        Collision.
    */

    if (
        hunterX === playerX &&
        hunterY === playerY
    ) {

        startEncounter();

        return;
    }


    drawMap();

}


/* =========================================================
   HUNTER TIMER
========================================================= */

function startHunterTimer() {

    stopHunterTimer();


    const speed =
        hunterSpeeds[level] || 300;


    hunterTimer =
        setInterval(
            moveHunter,
            speed
        );

}


/* =========================================================
   STOP HUNTER
========================================================= */

function stopHunterTimer() {

    if (hunterTimer !== null) {

        clearInterval(hunterTimer);

        hunterTimer = null;

    }

}


/* =========================================================
   PLAY HUNTER MUSIC
========================================================= */

function playHunterMusic() {

    if (!hunterSongs[level]) {
        return;
    }


    /*
        Stop previous music.
    */

    hunterMusic.pause();

    hunterMusic.currentTime = 0;


    /*
        Set level-specific song.
    */

    hunterMusic.src =
        hunterSongs[level];


    hunterMusic.onerror =
        function() {

            /*
                If hunter4.mp3 etc. doesn't exist,
                use the original distressing song.
            */

            hunterMusic.onerror = null;

            hunterMusic.src =
                "audio/disstressing.mp3";

            hunterMusic.play()
                .catch(() => {});

        };


    hunterMusic.play()
        .catch(() => {});

}


/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel() {

    /*
        Stop current hunter.
    */

    stopHunterTimer();

    hunterActive = false;

    hunterMusic.pause();

    hunterMusic.currentTime = 0;


    /*
        Level 10 exit = WIN.
    */

    if (level >= 10) {

        winGame();

        return;

    }


    level++;


    playerX = 1;
    playerY = 1;


    document.getElementById(
        "message"
    ).textContent =
        "LEVEL " + level;


    /*
        Small screen flash.
    */

    const flash =
        document.getElementById(
            "levelFlash"
        );

    flash.style.opacity = "1";


    setTimeout(() => {

        flash.style.opacity = "0";

    }, 250);


    /*
        Hunter begins at Level 4.
    */

    if (level >= 4 && level <= 9) {

        spawnHunter();

        playHunterMusic();

    }


    drawMap();

}


/* =========================================================
   WIN
========================================================= */

function winGame() {

    gameOver = true;

    stopHunterTimer();

    hunterMusic.pause();

    ambience.pause();


    document.getElementById(
        "message"
    ).textContent =
        "YOU ESCAPED";


    const text =
        document.getElementById(
            "creepyText"
        );


    text.textContent =
        "YOU ESCAPED";


    text.style.opacity = "1";


    document.getElementById(
        "encounter"
    ).style.display =
        "flex";


    setTimeout(() => {

        window.location.href =
            "index.html";

    }, 3500);

}


/* =========================================================
   ENCOUNTER
========================================================= */

const creepyLines = [

    "пойманный"

];


function startEncounter() {

    if (gameOver) {
        return;
    }

    gameOver = true;


    stopHunterTimer();

    hunterMusic.pause();


    /*
        Turn the screen black.
    */

    const encounter =
        document.getElementById(
            "encounter"
        );

    encounter.style.display =
        "flex";


    /*
        Turn off lights sound.
    */

    lightsOff.play()
        .catch(() => {});


    const text =
        document.getElementById(
            "creepyText"
        );


    text.textContent =
        creepyLines[
            Math.floor(
                Math.random() *
                creepyLines.length
            )
        ];


    setTimeout(() => {

        text.style.opacity = "1";

    }, 300);


    /*
        Return to index.html.
    */

    setTimeout(() => {

        window.location.href =
            "index.html";

    }, 6000);

}


/* =========================================================
   START AMBIENCE
=========================================================

   Browsers generally require user interaction before
   allowing audio to play.

========================================================= */

document.addEventListener(
    "click",
    () => {

        ambience.play()
            .catch(() => {});

    },
    {
        once: true
    }
);


/*
    Also start ambience when the player
    first presses a movement key.
*/

document.addEventListener(
    "keydown",
    (e) => {

        const key =
            e.key.toLowerCase();

        const movementKeys = [
            "w",
            "a",
            "s",
            "d",
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright"
        ];

        if (
            movementKeys.includes(key)
        ) {

            ambience.play()
                .catch(() => {});

        }

    },
    {
        once: true
    }
);


/* =========================================================
   START GAME
========================================================= */

drawMap();

</script>

</body>
</html>
