<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flash</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #flash-container {
            width: 100vw;
            height: 100vh;
        }

        #flash-container ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>

<div id="flash-container"></div>

<script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        player.style.width = "100%";
        player.style.height = "100%";

        document
            .getElementById("flash-container")
            .appendChild(player);

        player.load("youare.swf");
    });
</script>

</body>
</html>
